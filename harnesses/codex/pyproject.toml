[project]
name = "bioagent-codex"
version = "0.1.0"
description = "The pinned Verifiers v1 Codex harness used by BioAgent evaluations."
requires-python = ">=3.13,<3.14"
dependencies = ["verifiers==0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bioagent_codex"]
