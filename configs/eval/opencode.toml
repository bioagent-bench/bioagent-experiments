model = "z-ai/glm-5.2"
num_rollouts = 1
max_concurrent = 1
push = false

[sampling]
temperature = 0.2
reasoning_effort = "high"
max_tokens = 32768

[client]
type = "eval"
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"

[taskset]
id = "bioagent-taskset"
metadata_path = "~/dev/bioagent-bench/src/task_metadata.json"
data_root = "~/dev/bioagent-data"
task_id = "cystic-fibrosis"
include_reference = true
staging = "local"

[taskset.task]
artifact_root = "artifacts"

[taskset.task.judge]
model = "openai/gpt-5.4-nano"
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"

[taskset.task.judge.sampling]
reasoning_effort = "medium"

[harness]
id = "bioagent-opencode"
version = "1.15.11"

[harness.runtime]
type = "subprocess"

[timeout]
setup = 3600
rollout = 14400
finalize = 3600
scoring = 3600
