[project]
name = "bioagent-experiments"
version = "0.2.0"
description = "BioAgent evaluations built on the Verifiers v1 taskset and harness APIs."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bioagent-codex",
    "bioagent-opencode",
    "bioagent-taskset",
    "renderers==0.1.8.dev58",
    "verifiers==0.2.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "harnesses/*",
    "judges/*",
    "tasksets/*",
]

[tool.uv.sources]
bioagent-codex = { workspace = true }
bioagent-opencode = { workspace = true }
bioagent-judge = { workspace = true }
bioagent-taskset = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.1",
]
analysis = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--quiet", "--strict-markers"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["ablation", "plotting", "utils"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
